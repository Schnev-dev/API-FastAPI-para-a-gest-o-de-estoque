[project]
name = "gestion-de-stock"
version = "0.1.0"
description = "API para registrar produtos e gerenciar entradas e saídas de estoque."
authors = [
    {name = "Schnev-dev",email = "schnevthompson@proton.me"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.143.0,<0.144.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
